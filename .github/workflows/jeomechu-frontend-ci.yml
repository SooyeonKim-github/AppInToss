name: Jeomechu Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Jeomechu/frontend/**"
      - ".github/workflows/jeomechu-frontend-ci.yml"
  pull_request:
    paths:
      - "Jeomechu/frontend/**"
      - ".github/workflows/jeomechu-frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jeomechu/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Jeomechu/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build Apps-in-Toss bundle
        run: npm run build
