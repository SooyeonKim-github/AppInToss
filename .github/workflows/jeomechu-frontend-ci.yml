name: Jeomechu Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Jeomechu/frontend/**"
      - ".github/workflows/jeomechu-frontend-ci.yml"
  pull_request:
    paths:
      - "Jeomechu/frontend/**"
      - ".github/workflows/jeomechu-frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Jeomechu/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Jeomechu/frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build Apps-in-Toss QR test bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://jeomechu-api-production.up.railway.app
          VITE_REWARDED_AD_UNIT_ID: ait-ad-test-rewarded-id

      - name: Upload QR test bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jeomechu-ait-qr-test
          path: Jeomechu/frontend/jeomechu.ait
          if-no-files-found: error
          retention-days: 14
